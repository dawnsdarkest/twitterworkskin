<!--STATIC TEMPLATE-->
<div class="twt"><div class="light"><div class="bg1">

  <!--header-->
  <div class="headerdm"><span class="headerbutton1"></span><span class="headertext">Tweet</span></div>

  <!--main tweet-->
  <!--user pfp, dn, username-->
  <img class="icon" src="LINK" width="40em" alt=" "/><div class="twtid"><span class="replyname">DISPLAY NAME</span><br /><span class="replyhandle">@USERNAME</span></div><span class="twtdots"></span>

  <!--tweet content-->
  <div class="twtcontent">This is a tweet.</div>

  <!--date and metadata-->
  <div class="twttimebox"><span class="twttime">00:00 AM · 02 April 26</span><hr class="line"><span class="twtnumbers1">3<span class="twttext"> Retweets</span></span><span class="twtnumbers2">1<span class="twttext"> Quote Tweet</span></span><span class="twtnumbers3">13<span class="twttext"> Likes</span></span><hr class="line"></div>
  <!--If retweets/quotes/likes are 0, don't add the corresponding element at all-->

  <!--buttons-->
  <div class="sharebar"><span class="twtbutton1a"></span><span class="twtbutton2a"></span><span class="twtbutton3b"></span><span class="twtbutton4"></span></div><hr class="line">
  <!--Options:
  - twtbutton1a (regular replies), twtbutton1b (can't reply),
  - twtbutton2a (regular retweets), twtbutton2b (can't retweet), twtbutton2c (retweeted),
  - twtbutton3a (empty heart), twtbutton3b (red heart)
  twtbutton4 is the share button.-->

  <!--reply-->
  <div class="reply">
    <!--user icon--> <img class="icon" src="LINK" width="40em" alt=" "/>
    <!--user ID--> <div class="replyid"><span class="replyname">DISPLAY NAME </span><span class="replyhandle"> @USERNAME · 6h <span class="screenreader"> ago</span></span></div><span class="replydots"></span>
    <div class="replycontent">
      <span class="replyhandle">Replying to <span class="links">@USERNAME</span></span>
      <hr class="line2">
      This is a reply.</div>
    <!--buttons--> <div class="sharebar1"><span class="replybutton1a"><span class="screenreader"> Replies:</span></span><span class="reply1a">1</span><span class="replybutton2a"><span class="screenreader"> Retweets:</span></span><span class="reply2a"> 1</span><span class="replybutton3a"><span class="screenreader">Likes:</span></span><span class="reply3a">2</span><span class="replybutton4"></span></div>
    <!--vertical bar--> <span class="replyvertical1"></span>
  </div>

  <!--Each reply is closed before the next one even if threaded.
  Separate not-threaded replies can be separated by adding <hr class="line" before <div class="reply" of the second reply.-->

  <!--Button options:
  - replybutton1a + reply1a (regular reply), replybutton1b + reply1b (can't reply),
  - replybutton2a + reply2a (regular retweet), replybutton2b + reply2b (can't retweet), replybutton2c + reply2c (retweeted)
  - replybutton3a + reply3a (empty heart), replybutton3b + reply3b (red heart)-->

  <!--sharebar and replyvertical options:
  - sharebar1 and replyvertical1 – up to 3 lines (including "Replying to @"),
  - sharebar2 and replyvertical2 – 4 to 6 lines (including "Replying to @"),
  - sharebar3 and replyvertical3 – 7 to 9 lines (including "Replying to @"),
  - sharebar4 and replyvertical4 – 10 to 13 (including "Replying to @"),
  - sharebar5 and replyvertical5 – 14 to 16 lines (including "Replying to @"),
  - sharebar alone (with no number!!) if it's a lone reply or the last reply of a thread-->

</div></div></div>
